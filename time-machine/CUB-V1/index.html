<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Can U Be</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; 
            margin: 0;
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center;
            color: white;
            font-family: Arial, sans-serif;
        }
        .container {
            text-align: center;
        }
        audio {
            margin-top: 20px;
            outline: none;
        }
        #fileInput {
            display: block;
            margin: 12px auto 0;
            color: white;
        }
        .song-note {
            font-size: 13px;
            max-width: 320px;
            margin: 12px auto 0;
            opacity: 0;
        }
        .container:hover .song-note,
        .container:focus-within .song-note {
            opacity: 1;
        }
        @media (hover: none) {
            .song-note {
                opacity: 1;
            }
        }
        .song-note a {
            color: white;
        }
        .back-to-timemachine {
            position: fixed !important;
            top: 20px !important;
            left: 20px !important;
            border: 1.5px solid #fff !important;
            padding: 8px 12px !important;
            margin: 0 !important;
            text-transform: uppercase !important;
            letter-spacing: 0.5px !important;
            background: transparent !important;
            color: #fff !important;
            box-shadow: none !important;
            border-radius: 0 !important;
            font-size: 15px !important;
            z-index: 1000 !important;
            text-decoration: none !important;
            transition: none !important;
            outline: none !important;
            display: inline !important;
        }
        .back-to-timemachine:hover, .back-to-timemachine:focus {
            background: transparent !important;
            color: #fff !important;
            border-color: #fff !important;
            outline: none !important;
        }
    </style>
</head>
<body>
    <a href="../../time-machine.html" class="back-to-timemachine">← Back to Time Machine</a>
    <div class="container">
        <h1>Can U Be</h1>
        <audio controls>
            Your browser does not support the audio element.
        </audio>
        <input type="file" id="fileInput" accept="audio/*" aria-label="Choose your own audio">
        <p class="song-note">The original song has been removed. <a href="../../v3.html">Read why</a>. Choose your own audio to play it here.</p>
        <h3>Website made by @bus0</h3>
    </div>
    <script>
        var audio = document.querySelector('audio');
        document.getElementById('fileInput').addEventListener('change', function() {
            var file = this.files[0];
            if (!file) return;
            if (audio.src) URL.revokeObjectURL(audio.src);
            audio.src = URL.createObjectURL(file);
            audio.play();
        });
    </script>
</body>
</html>
