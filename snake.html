<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game - Can U Be</title>
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <script>try{if(localStorage.getItem('theme')==='light')document.documentElement.dataset.theme='light'}catch(e){}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;700&display=swap">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="topbar">
        <a href="index.html" class="topbar-home">CAN U BE</a>
        <span class="live-dot" aria-hidden="true">●</span>
        <time class="clock" aria-label="Current time">00:00:00</time>
        <a href="index.html" class="topbar-back">← INDEX</a>
        <button class="theme-toggle" type="button" onclick="toggleTheme()" aria-label="Toggle theme">[LIGHT]</button>
    </header>

    <main class="page">
        <div class="page-head">
            <h1 data-scramble>SNAKE</h1>
            <p class="meta">04 / ARROW KEYS OR WASD TO MOVE</p>
        </div>

        <div class="game">
            <div class="stat-row">
                <div class="stat"><span class="stat-label">SCORE</span><span class="stat-value" id="score">0</span></div>
            </div>
            <canvas id="gameCanvas" class="game-canvas" width="400" height="400"></canvas>
            <p id="gameOver" class="game-over" hidden>GAME OVER — PRESS SPACE TO RESTART</p>
        </div>
    </main>

    <footer class="ticker marquee" aria-label="Website made by @bus0">
        <div class="marquee-track"><span>WEBSITE MADE BY @BUS0&nbsp;·&nbsp;</span><span>CAN U BE&nbsp;·&nbsp;</span></div>
    </footer>

    <script src="site.js"></script>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const gameOverElement = document.getElementById('gameOver');

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [
            {x: 10, y: 10}
        ];
        let food = {};
    let dx = 0;
    let dy = 0;
    let nextDx = 0;
    let nextDy = 0;
        let score = 0;
        let gameRunning = true;

        // Generate random food position that is NOT on the snake body
        function randomFood() {
            // Build a set of occupied cells for O(1) lookup
            const occupied = new Set(snake.map(seg => `${seg.x},${seg.y}`));
            const freeCells = [];
            for (let x = 0; x < tileCount; x++) {
                for (let y = 0; y < tileCount; y++) {
                    const key = `${x},${y}`;
                    if (!occupied.has(key)) freeCells.push({ x, y });
                }
            }
            // If no free cells remain, end game (win condition)
            if (freeCells.length === 0) {
                gameOver();
                return;
            }
            food = freeCells[Math.floor(Math.random() * freeCells.length)];
        }
        
        // Get current theme colors (strict black/white, from site.js)
        function getThemeColors() {
            return themeColors();
        }

        // Interpolation for smooth movement
        let interpolation = 0;
        let lastSnake = [...snake];

        // Draw everything with smooth animations
        function draw() {
            const colors = getThemeColors();
            
            // Clear canvas with theme background
            ctx.fillStyle = colors.bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw snake with smooth interpolation
            ctx.fillStyle = colors.fg;
            snake.forEach((segment, index) => {
                let drawX = segment.x;
                let drawY = segment.y;
                
                // Smooth movement interpolation
                if (interpolation < 1 && lastSnake[index]) {
                    drawX = lastSnake[index].x + (segment.x - lastSnake[index].x) * interpolation;
                    drawY = lastSnake[index].y + (segment.y - lastSnake[index].y) * interpolation;
                }
                
                ctx.fillRect(drawX * gridSize, drawY * gridSize, gridSize - 2, gridSize - 2);
            });

            // Draw apple as a hollow square so it reads apart from the solid snake
            ctx.strokeStyle = colors.fg;
            ctx.lineWidth = 2;
            ctx.strokeRect(food.x * gridSize + 1, food.y * gridSize + 1, gridSize - 4, gridSize - 4);
        }

        // Update game state
        function update() {
            if (!gameRunning) return;
            // Don't move if no direction is set
            if (dx === 0 && dy === 0) return;

            // Save previous snake position for smooth interpolation
            lastSnake = snake.map(seg => ({...seg}));
            interpolation = 0;

            // Apply queued direction change (prevents double turns in one frame)
            if ((nextDx !== 0 || nextDy !== 0) && (dx === 0 && dy === 0 || !(nextDx === -dx && nextDy === -dy))) {
                dx = nextDx;
                dy = nextDy;
            }

            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            // Check wall collision
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }

            // Check self collision
            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                gameOver();
                return;
            }

            snake.unshift(head);

            // Check food collision
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.textContent = score;
                randomFood();
            } else {
                snake.pop();
            }
        }

        function gameOver() {
            gameRunning = false;
            gameOverElement.hidden = false;
        }

        function resetGame() {
            snake = [{x: 10, y: 10}];
            dx = 0;
            dy = 0;
            nextDx = 0;
            nextDy = 0;
            score = 0;
            scoreElement.textContent = score;
            gameRunning = true;
            gameOverElement.hidden = true;
            randomFood();
        }

        // Animation loop for smooth rendering
        function animate() {
            if (interpolation < 1) {
                interpolation += 0.15; // Smooth step increment
                if (interpolation > 1) interpolation = 1;
            }
            draw();
            requestAnimationFrame(animate);
        }

        // Game logic loop
        function gameLoop() {
            update();
        }

        // Handle keyboard input
        document.addEventListener('keydown', (e) => {
            // Prevent page scroll with arrow keys and spacebar
            if (e.code === 'Space' || e.key === ' ' || e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                e.preventDefault();
            }
            if (!gameRunning && e.code === 'Space') {
                resetGame();
                return;
            }

            if (!gameRunning) return;

            // On first keypress, set both dx/dy and nextDx/nextDy so snake starts immediately
            function setDirection(nx, ny) {
                if (dx === 0 && dy === 0) {
                    dx = nx;
                    dy = ny;
                    nextDx = nx;
                    nextDy = ny;
                } else {
                    nextDx = nx;
                    nextDy = ny;
                }
            }
            switch(e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    if (dx === 0 && dy === 0 || dy !== 1) setDirection(0, -1);
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    if (dx === 0 && dy === 0 || dy !== -1) setDirection(0, 1);
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    if (dx === 0 && dy === 0 || dx !== 1) setDirection(-1, 0);
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    if (dx === 0 && dy === 0 || dx !== -1) setDirection(1, 0);
                    break;
            }
        });

    // Initialize game
    dx = 0;
    dy = 0;
    nextDx = 0;
    nextDy = 0;
    randomFood();
    setInterval(gameLoop, 100);  // Game logic at 10 FPS
    requestAnimationFrame(animate);  // Smooth rendering at 60 FPS
    </script>
</body>
</html>
