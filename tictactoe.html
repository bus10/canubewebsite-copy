<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe - Can U Be</title>
    <meta name="description" content="Play Tic Tac Toe in brutalist style">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <script>try{if(localStorage.getItem('theme')==='light')document.documentElement.dataset.theme='light'}catch(e){}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;700&display=swap">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="topbar">
        <a href="index.html" class="topbar-home">CAN U BE</a>
        <span class="live-dot" aria-hidden="true">●</span>
        <time class="clock" aria-label="Current time">00:00:00</time>
        <a href="index.html" class="topbar-back">← INDEX</a>
        <button class="theme-toggle" type="button" onclick="toggleTheme()">[LIGHT]</button>
    </header>

    <main class="page">
        <div class="page-head">
            <h1 data-scramble>TIC TAC TOE</h1>
            <p class="meta">06 / YOU ARE X, BOT IS O</p>
        </div>

        <div class="game">
            <p class="game-status" id="status">Your Turn (X)</p>

            <div class="game-board" id="board">
                <button class="cell" type="button" data-index="0"></button>
                <button class="cell" type="button" data-index="1"></button>
                <button class="cell" type="button" data-index="2"></button>
                <button class="cell" type="button" data-index="3"></button>
                <button class="cell" type="button" data-index="4"></button>
                <button class="cell" type="button" data-index="5"></button>
                <button class="cell" type="button" data-index="6"></button>
                <button class="cell" type="button" data-index="7"></button>
                <button class="cell" type="button" data-index="8"></button>
            </div>

            <div class="btn-row">
                <button class="btn" type="button" id="resetBtn">RESET GAME</button>
            </div>
        </div>
    </main>

    <footer class="ticker marquee" aria-label="Website made by @bus0">
        <div class="marquee-track"><span>WEBSITE MADE BY @BUS0&nbsp;·&nbsp;</span><span>CAN U BE&nbsp;·&nbsp;</span></div>
    </footer>

    <script src="site.js"></script>
    <script>
        const cells = document.querySelectorAll('.cell');
        const statusDisplay = document.getElementById('status');
        const resetButton = document.getElementById('resetBtn');
        
        let currentPlayer = 'X';
        let gameActive = true;
        let gameState = ['', '', '', '', '', '', '', '', ''];
        
        const winningConditions = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],
            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],
            [0, 4, 8],
            [2, 4, 6]
        ];
        
        function handleCellClick(e) {
            const clickedCell = e.target;
            const clickedCellIndex = parseInt(clickedCell.getAttribute('data-index'));
            
            // Only allow human player to move on their turn
            if (gameState[clickedCellIndex] !== '' || !gameActive || currentPlayer !== 'X') {
                return;
            }
            
            handleCellPlayed(clickedCell, clickedCellIndex);
            handleResultValidation();
        }
        
        function handleCellPlayed(clickedCell, clickedCellIndex) {
            gameState[clickedCellIndex] = currentPlayer;
            clickedCell.textContent = currentPlayer;
            clickedCell.classList.add('taken');
            clickedCell.classList.add(currentPlayer === 'X' ? 'player-x' : 'player-o');
        }
        
        function handleResultValidation() {
            let roundWon = false;
            
            for (let i = 0; i < winningConditions.length; i++) {
                const winCondition = winningConditions[i];
                const a = gameState[winCondition[0]];
                const b = gameState[winCondition[1]];
                const c = gameState[winCondition[2]];
                
                if (a === '' || b === '' || c === '') {
                    continue;
                }
                
                if (a === b && b === c) {
                    roundWon = true;
                    break;
                }
            }
            
            if (roundWon) {
                if (currentPlayer === 'X') {
                    statusDisplay.textContent = 'You Win!';
                } else {
                    statusDisplay.textContent = 'Bot Wins!';
                }
                gameActive = false;
                return;
            }
            
            const roundDraw = !gameState.includes('');
            if (roundDraw) {
                statusDisplay.textContent = 'Draw!';
                gameActive = false;
                return;
            }
            
            handlePlayerChange();
        }
        
        function handlePlayerChange() {
            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            
            if (currentPlayer === 'X') {
                statusDisplay.textContent = "Your Turn (X)";
            } else {
                statusDisplay.textContent = "Bot is thinking...";
                // Bot makes a move after a short delay
                setTimeout(botMove, 500);
            }
        }
        
        // Minimax algorithm for bot AI
        function minimax(board, depth, isMaximizing) {
            const winner = checkWinner(board);
            
            // Terminal states
            if (winner === 'O') return 10 - depth;
            if (winner === 'X') return depth - 10;
            if (!board.includes('')) return 0;
            
            if (isMaximizing) {
                let bestScore = -Infinity;
                for (let i = 0; i < 9; i++) {
                    if (board[i] === '') {
                        board[i] = 'O';
                        let score = minimax(board, depth + 1, false);
                        board[i] = '';
                        bestScore = Math.max(score, bestScore);
                    }
                }
                return bestScore;
            } else {
                let bestScore = Infinity;
                for (let i = 0; i < 9; i++) {
                    if (board[i] === '') {
                        board[i] = 'X';
                        let score = minimax(board, depth + 1, true);
                        board[i] = '';
                        bestScore = Math.min(score, bestScore);
                    }
                }
                return bestScore;
            }
        }
        
        function checkWinner(board) {
            for (let condition of winningConditions) {
                const [a, b, c] = condition;
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    return board[a];
                }
            }
            return null;
        }
        
        function botMove() {
            if (!gameActive) return;
            
            let bestScore = -Infinity;
            let bestMove = -1;
            
            // Find the best move using minimax
            for (let i = 0; i < 9; i++) {
                if (gameState[i] === '') {
                    gameState[i] = 'O';
                    let score = minimax(gameState, 0, false);
                    gameState[i] = '';
                    
                    if (score > bestScore) {
                        bestScore = score;
                        bestMove = i;
                    }
                }
            }
            
            // Make the move
            if (bestMove !== -1) {
                const cell = cells[bestMove];
                handleCellPlayed(cell, bestMove);
                handleResultValidation();
            }
        }
        
        function handleReset() {
            gameActive = true;
            currentPlayer = 'X';
            gameState = ['', '', '', '', '', '', '', '', ''];
            statusDisplay.textContent = "Your Turn (X)";
            
            cells.forEach(cell => {
                cell.textContent = '';
                cell.classList.remove('taken', 'player-x', 'player-o');
            });
        }
        
        // Event listeners
        cells.forEach(cell => cell.addEventListener('click', handleCellClick));
        resetButton.addEventListener('click', handleReset);
        
        // Keyboard navigation
        cells.forEach((cell, index) => {
            cell.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    cell.click();
                }
                
                // Arrow key navigation
                let nextIndex = index;
                if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    nextIndex = (index + 1) % 9;
                } else if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    nextIndex = (index - 1 + 9) % 9;
                } else if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    nextIndex = (index + 3) % 9;
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    nextIndex = (index - 3 + 9) % 9;
                }
                
                if (nextIndex !== index) {
                    cells[nextIndex].focus();
                }
            });
        });
    </script>
</body>
</html>
